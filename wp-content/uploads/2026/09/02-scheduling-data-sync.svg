<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-label="Scheduling and data sync: appointment booked into calendar and synced to CRM">
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <filter id="sc-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#072032" flood-opacity="0.10"/>
    </filter>
    <style>
      .sc-slot{opacity:0;animation:scSlot .6s ease forwards}
      @keyframes scSlot{to{opacity:1}}
      .sc-book{transform-box:fill-box;transform-origin:center;animation:scBook 4s ease-in-out infinite}
      @keyframes scBook{0%,20%{opacity:.5;transform:scale(.9)}30%,100%{opacity:1;transform:scale(1)}}
      .sc-check{stroke-dasharray:26;stroke-dashoffset:26;animation:scCheck 4s ease-in-out infinite}
      @keyframes scCheck{0%,25%{stroke-dashoffset:26}45%,100%{stroke-dashoffset:0}}
      .sc-flow{stroke-dasharray:9 11;animation:scDash 1.1s linear infinite}
      @keyframes scDash{to{stroke-dashoffset:-40}}
      .sc-crm{transform-origin:558px 260px;animation:scCrm 4s ease-in-out infinite}
      @keyframes scCrm{0%,55%{transform:scale(1)}65%{transform:scale(1.05)}75%,100%{transform:scale(1)}}
      .sc-spin{transform-origin:404px 260px;animation:scSpin 3s linear infinite}
      @keyframes scSpin{to{transform:rotate(360deg)}}
    </style>
  </defs>

  <rect width="720" height="540" rx="28" fill="url(#sc-bg)"/>
  <rect x="1" y="1" width="718" height="538" rx="27" fill="none"/>

  <!-- Calendar card -->
  <g filter="url(#sc-shadow)">
    <rect x="56" y="90" width="300" height="340" rx="20" fill="#fff" stroke="#D6DFE7" stroke-width="2"/>
    <rect x="56" y="90" width="300" height="60" rx="20" fill="#072032"/>
    <rect x="56" y="130" width="300" height="20" fill="#072032"/>
    <text x="80" y="128" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#fff">Availability</text>
    <text x="332" y="128" text-anchor="end" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#7FE0B4">Tomorrow</text>
  </g>

  <!-- slots -->
  <g font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600">
    <g class="sc-slot" style="animation-delay:.2s"><rect x="80" y="176" width="252" height="42" rx="10" fill="#F1F5F9" stroke="#E4EBF1"/><text x="98" y="203" fill="#475569">9:20 AM</text><text x="312" y="203" text-anchor="end" fill="#94A3B8">open</text></g>
    <g class="sc-slot" style="animation-delay:.4s"><rect x="80" y="228" width="252" height="42" rx="10" fill="#F1F5F9" stroke="#E4EBF1"/><text x="98" y="255" fill="#475569">10:40 AM</text><text x="312" y="255" text-anchor="end" fill="#94A3B8">open</text></g>
    <!-- selected/booked slot -->
    <g class="sc-slot" style="animation-delay:.6s">
      <rect x="80" y="280" width="252" height="42" rx="10" fill="#FFF2EC" stroke="#FF7E55" stroke-width="2"/>
      <text x="98" y="307" fill="#072032">11:15 AM</text>
      <g class="sc-book">
        <rect x="256" y="288" width="66" height="26" rx="13" fill="#FF7E55"/>
        <text x="289" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">Booked</text>
      </g>
    </g>
    <g class="sc-slot" style="animation-delay:.8s"><rect x="80" y="332" width="252" height="42" rx="10" fill="#F1F5F9" stroke="#E4EBF1"/><text x="98" y="359" fill="#475569">2:00 PM</text><text x="312" y="359" text-anchor="end" fill="#94A3B8">open</text></g>
  </g>

  <!-- connecting flow lines (calendar edge -> CRM edge) -->
  <path class="sc-flow" d="M356 230 C 390 230, 388 250, 380 258" fill="none" stroke="#0B5CFF" stroke-width="3" stroke-linecap="round"/>
  <path class="sc-flow" d="M428 262 C 440 268, 448 280, 452 290" fill="none" stroke="#0B5CFF" stroke-width="3" stroke-linecap="round"/>

  <!-- sync icon: two-arrow circular refresh, centred at 404,260 -->
  <circle cx="404" cy="260" r="30" fill="#fff" stroke="#E4EBF1" stroke-width="2"/>
  <g class="sc-spin">
    <g transform="translate(404,260)">
      <path d="M0 -15 A15 15 0 0 1 13 8" fill="none" stroke="#0B5CFF" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M0 15 A15 15 0 0 1 -13 -8" fill="none" stroke="#0B5CFF" stroke-width="3.2" stroke-linecap="round"/>
      <path d="M13 8 l2 -7 -7 1 z" fill="#0B5CFF"/>
      <path d="M-13 -8 l-2 7 7 -1 z" fill="#0B5CFF"/>
    </g>
  </g>

  <!-- CRM card -->
  <g class="sc-crm">
    <g filter="url(#sc-shadow)">
      <rect x="452" y="150" width="212" height="220" rx="20" fill="#072032"/>
    </g>
    <text x="558" y="188" text-anchor="middle" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#fff" letter-spacing="1">CRM RECORD</text>
    <line x1="478" y1="204" x2="638" y2="204" stroke="#FFFFFF" stroke-opacity="0.14"/>

    <circle cx="500" cy="242" r="20" fill="#1B3B54"/>
    <path d="M500 232a7 7 0 100 14 7 7 0 000-14zm-12 24c0-6 6-9 12-9s12 3 12 9z" fill="#7FE0B4"/>
    <text x="532" y="238" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#fff">Contact updated</text>
    <text x="532" y="256" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#9FB3C4">HubSpot · Salesforce</text>

    <line x1="478" y1="284" x2="638" y2="284" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <circle cx="500" cy="322" r="20" fill="#12402E"/>
    <path class="sc-check" d="M492 322 l6 6 12 -13" fill="none" stroke="#7FE0B4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="532" y="318" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="600" fill="#fff">Event synced</text>
    <text x="532" y="336" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#9FB3C4">Google Calendar</text>
  </g>

  <text x="360" y="470" text-anchor="middle" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#5C6972">Books the slot, then writes it straight back to your systems</text>
</svg>