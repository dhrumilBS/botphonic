<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-label="AI sales automation: qualifying and scoring inbound leads by phone">
  <defs>
    <linearGradient id="sa-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <linearGradient id="sa-gauge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7E55"/>
      <stop offset="1" stop-color="#1E9E6A"/>
    </linearGradient>
    <filter id="sa-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#072032" flood-opacity="0.10"/>
    </filter>
    <style>
      .sa-q .sa-dot{transform-box:fill-box;transform-origin:center;animation:saDot 5s ease-in-out infinite}
      @keyframes saDot{0%,100%{opacity:.85}50%{opacity:1}}
      .sa-tick{stroke-dasharray:22;stroke-dashoffset:22;animation:saTick 5s ease-in-out infinite}
      @keyframes saTick{0%,10%{stroke-dashoffset:22}22%,100%{stroke-dashoffset:0}}
      .sa-needle{transform-origin:536px 246px;animation:saNeedle 5s cubic-bezier(.4,0,.2,1) infinite}
      @keyframes saNeedle{0%,30%{transform:rotate(-88deg)}65%,95%{transform:rotate(48deg)}100%{transform:rotate(-88deg)}}
      .sa-score{opacity:0;animation:saScore 5s ease-in-out infinite}
      @keyframes saScore{0%,45%{opacity:0}58%,100%{opacity:1}}
      .sa-arc{stroke-dasharray:283;stroke-dashoffset:283;animation:saArc 5s cubic-bezier(.4,0,.2,1) infinite}
      @keyframes saArc{0%,30%{stroke-dashoffset:283}65%,100%{stroke-dashoffset:57}}
      .sa-push{transform-origin:536px 380px;animation:saPush 5s ease-in-out infinite}
      @keyframes saPush{0%,60%{opacity:.5;transform:translateY(6px)}70%,100%{opacity:1;transform:translateY(0)}}
    </style>
  </defs>

  <rect width="720" height="540" rx="28" fill="url(#sa-bg)"/>
  <rect x="1" y="1" width="718" height="538" rx="27" fill="none"/>

  <!-- Qualifying panel -->
  <g filter="url(#sa-shadow)">
    <rect x="52" y="96" width="312" height="348" rx="20" fill="#fff" stroke="#D6DFE7" stroke-width="2"/>
  </g>
  <text x="76" y="140" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="18" font-weight="700" fill="#072032">Qualifying the lead</text>
  <text x="76" y="162" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#5C6972">live on the call</text>

  <g class="sa-q" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#072032">
    <g>
      <circle class="sa-dot" cx="92" cy="204" r="13" fill="#EAF6F0"/><path class="sa-tick" d="M86 204 l4 4 8 -9" fill="none" stroke="#1E9E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:.0s"/>
      <text x="116" y="209">Budget confirmed</text>
    </g>
    <g>
      <circle class="sa-dot" cx="92" cy="248" r="13" fill="#EAF6F0"/><path class="sa-tick" d="M86 248 l4 4 8 -9" fill="none" stroke="#1E9E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:.4s"/>
      <text x="116" y="253">Timeline captured</text>
    </g>
    <g>
      <circle class="sa-dot" cx="92" cy="292" r="13" fill="#EAF6F0"/><path class="sa-tick" d="M86 292 l4 4 8 -9" fill="none" stroke="#1E9E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:.8s"/>
      <text x="116" y="297">Authority checked</text>
    </g>
    <g>
      <circle class="sa-dot" cx="92" cy="336" r="13" fill="#EAF6F0"/><path class="sa-tick" d="M86 336 l4 4 8 -9" fill="none" stroke="#1E9E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.2s"/>
      <text x="116" y="341">Need identified</text>
    </g>
    <g>
      <circle class="sa-dot" cx="92" cy="380" r="13" fill="#EAF6F0"/><path class="sa-tick" d="M86 380 l4 4 8 -9" fill="none" stroke="#1E9E6A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.6s"/>
      <text x="116" y="385">Contact verified</text>
    </g>
  </g>

  <!-- Score gauge (centre at 536,246) -->
  <g transform="translate(536,246)">
    <path d="M-90 0 A90 90 0 0 1 90 0" fill="none" stroke="#E4EBF1" stroke-width="18" stroke-linecap="round"/>
    <path class="sa-arc" d="M-90 0 A90 90 0 0 1 90 0" fill="none" stroke="url(#sa-gauge)" stroke-width="18" stroke-linecap="round"/>
  </g>
  <!-- needle pivots on hub at 536,246 -->
  <g class="sa-needle">
    <path d="M536 246 L533 176 L539 176 Z" fill="#072032"/>
  </g>
  <circle cx="536" cy="246" r="9" fill="#072032"/>
  <g class="sa-score">
    <text x="536" y="300" text-anchor="middle" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="40" font-weight="800" fill="#072032">92</text>
    <text x="536" y="322" text-anchor="middle" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#1E9E6A" letter-spacing="1">HOT LEAD</text>
  </g>
  <text x="536" y="200" text-anchor="middle" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#072032">Lead score</text>

  <!-- pushed to CRM -->
  <g class="sa-push">
    <g transform="translate(446,352)">
      <rect width="180" height="56" rx="14" fill="#072032" filter="url(#sa-shadow)"/>
      <circle cx="28" cy="28" r="15" fill="none" stroke="#7FE0B4" stroke-width="2.5"/>
      <path d="M28 21 v14 M21 28 h14" stroke="#7FE0B4" stroke-width="3" stroke-linecap="round"/>
      <text x="56" y="25" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#fff">Scored &amp; pushed</text>
      <text x="56" y="42" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#9FB3C4">to your CRM pipeline</text>
    </g>
  </g>
</svg>