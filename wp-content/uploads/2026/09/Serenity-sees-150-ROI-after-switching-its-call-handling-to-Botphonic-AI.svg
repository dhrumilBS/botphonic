<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-label="Serenity results after switching to Botphonic AI: 150% ROI, 25% higher conversion, 50% shorter call handling, 20% fewer errors, 15% higher agent satisfaction">
  <defs>
    <linearGradient id="rs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8FC"/>
    </linearGradient>
    <linearGradient id="rs-coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9068"/><stop offset="1" stop-color="#FF7E55"/>
    </linearGradient>
    <linearGradient id="rs-trend" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7E55"/><stop offset="1" stop-color="#1E9E6A"/>
    </linearGradient>
    <linearGradient id="rs-area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1E9E6A" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1E9E6A" stop-opacity="0"/>
    </linearGradient>
    <filter id="rs-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#072032" flood-opacity="0.10"/>
    </filter>
    <style>
      .rs-tile{opacity:0;transform-box:fill-box;transform-origin:center;animation:rsTile 6.5s ease-in-out infinite}
      @keyframes rsTile{0%{opacity:0;transform:translateY(10px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
      .rs-trend{stroke-dasharray:340;stroke-dashoffset:340;animation:rsTrend 6.5s ease-in-out infinite}
      @keyframes rsTrend{0%,10%{stroke-dashoffset:340}55%,100%{stroke-dashoffset:0}}
      .rs-area{opacity:0;animation:rsArea 6.5s ease-in-out infinite}
      @keyframes rsArea{0%,35%{opacity:0}60%,100%{opacity:1}}
      .rs-dot{transform-box:fill-box;transform-origin:center;opacity:0;animation:rsDot 6.5s ease-in-out infinite}
      @keyframes rsDot{0%,45%{opacity:0;transform:scale(.4)}55%,100%{opacity:1;transform:scale(1)}}
      .rs-roi{opacity:0;animation:rsRoi 6.5s ease-in-out infinite}
      @keyframes rsRoi{0%,50%{opacity:0}62%,100%{opacity:1}}
      .rs-up{transform-box:fill-box;transform-origin:center;animation:rsUp 2.4s ease-in-out infinite}
      @keyframes rsUp{0%,100%{transform:translateY(0);opacity:.7}50%{transform:translateY(-4px);opacity:1}}
      .rs-bar{transform-box:fill-box;transform-origin:center bottom;transform:scaleY(0);animation:rsBar 6.5s ease-in-out infinite}
      @keyframes rsBar{0%,20%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
    </style>
  </defs>

  <rect width="640" height="360" rx="24" fill="url(#rs-bg)"/>
  <rect x="1" y="1" width="638" height="358" rx="23" fill="none" stroke="#D6DFE7" stroke-width="2"/>

  <!-- ===== LEFT: ROI trend card ===== -->
  <g filter="url(#rs-shadow)">
    <rect x="24" y="24" width="372" height="312" rx="20" fill="#fff" stroke="#E4EBF1" stroke-width="1.5"/>
  </g>

  <!-- Serenity header -->
  <circle cx="58" cy="58" r="18" fill="#072032"/>
  <text x="58" y="63" text-anchor="middle" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="800" fill="#7FE0B4">S</text>
  <text x="86" y="52" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="800" fill="#072032">Serenity</text>
  <text x="86" y="69" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11.5" fill="#5C6972">call handling moved to Botphonic AI</text>

  <!-- ROI headline -->
  <g class="rs-roi">
    <text x="48" y="128" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="52" font-weight="800" fill="#1E9E6A">150%</text>
    <!-- static wrapper positions the arrow; inner group only animates -->
    <g transform="translate(214,96)">
      <g class="rs-up"><path d="M0 12 L8 0 L16 12 Z" fill="#1E9E6A"/></g>
    </g>
    <text x="238" y="120" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="16" font-weight="800" fill="#072032">ROI</text>
  </g>
  <text x="48" y="150" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#5C6972">Return after switching call handling to AI</text>

  <!-- chart area -->
  <g transform="translate(48,168)">
    <!-- gridlines -->
    <g stroke="#EEF3F8" stroke-width="1.5">
      <line x1="0" y1="0"  x2="324" y2="0"/>
      <line x1="0" y1="40" x2="324" y2="40"/>
      <line x1="0" y1="80" x2="324" y2="80"/>
      <line x1="0" y1="120" x2="324" y2="120"/>
    </g>
    <!-- area fill under the trend -->
    <path class="rs-area" d="M0 118 L54 104 L108 92 L162 70 L216 52 L270 30 L324 8 L324 120 L0 120 Z" fill="url(#rs-area)"/>
    <!-- rising trend line -->
    <path class="rs-trend" d="M0 118 L54 104 L108 92 L162 70 L216 52 L270 30 L324 8" fill="none" stroke="url(#rs-trend)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- end dot -->
    <circle class="rs-dot" cx="324" cy="8" r="6" fill="#1E9E6A" stroke="#fff" stroke-width="2.5"/>
    <!-- baseline labels -->
    <text x="0" y="136" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#94A3B8">Before</text>
    <text x="324" y="136" text-anchor="end" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="10.5" fill="#94A3B8">After</text>
  </g>

  <!-- scope caption (fits inside the 372px-wide card: x 24..396) -->
  <text x="48" y="326" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5C6972">Inbound answering · booking · follow-up moved to AI</text>

  <!-- ===== RIGHT: 4 result metric tiles ===== -->
  <!-- Tile A: conversion 25% -->
  <g class="rs-tile" style="animation-delay:0s">
    <rect x="416" y="24" width="200" height="72" rx="14" fill="#fff" stroke="#E4EBF1" stroke-width="1.5" filter="url(#rs-shadow)"/>
    <rect x="432" y="40" width="40" height="40" rx="11" fill="#FF7E55" fill-opacity="0.12"/>
    <g transform="translate(452,60)" fill="none" stroke="#FF7E55" stroke-width="2.2" stroke-linecap="round">
      <path d="M-9 6 L-3 0 L2 4 L9 -7"/>
      <path d="M4 -7 L9 -7 L9 -2"/>
    </g>
    <text x="486" y="58" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#072032">+25%</text>
    <text x="486" y="76" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5C6972">Higher conversion</text>
  </g>

  <!-- Tile B: handling time 50% -->
  <g class="rs-tile" style="animation-delay:.5s">
    <rect x="416" y="104" width="200" height="72" rx="14" fill="#fff" stroke="#E4EBF1" stroke-width="1.5" filter="url(#rs-shadow)"/>
    <rect x="432" y="120" width="40" height="40" rx="11" fill="#0B5CFF" fill-opacity="0.10"/>
    <g transform="translate(452,140)" fill="none" stroke="#0B5CFF" stroke-width="2.2" stroke-linecap="round">
      <circle r="11"/>
      <path d="M0 -6 V0 L5 4"/>
    </g>
    <text x="486" y="138" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#072032">−50%</text>
    <text x="486" y="156" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5C6972">Call handling time</text>
  </g>

  <!-- Tile C: fewer errors 20% -->
  <g class="rs-tile" style="animation-delay:1s">
    <rect x="416" y="184" width="200" height="72" rx="14" fill="#fff" stroke="#E4EBF1" stroke-width="1.5" filter="url(#rs-shadow)"/>
    <rect x="432" y="200" width="40" height="40" rx="11" fill="#1E9E6A" fill-opacity="0.12"/>
    <g transform="translate(452,220)" fill="none" stroke="#1E9E6A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0 -11 L9 -7 V1 C9 7 5 10 0 12 C-5 10 -9 7 -9 1 V-7 Z"/>
      <path d="M-4 0 l3 3 6 -7"/>
    </g>
    <text x="486" y="218" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#072032">−20%</text>
    <text x="486" y="236" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5C6972">Fewer booking errors</text>
  </g>

  <!-- Tile D: agent satisfaction 15% -->
  <g class="rs-tile" style="animation-delay:1.5s">
    <rect x="416" y="264" width="200" height="72" rx="14" fill="#fff" stroke="#E4EBF1" stroke-width="1.5" filter="url(#rs-shadow)"/>
    <rect x="432" y="280" width="40" height="40" rx="11" fill="#7C5CFF" fill-opacity="0.12"/>
    <g transform="translate(452,300)" fill="none" stroke="#7C5CFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle r="11"/>
      <path d="M-5 -2 h.01 M5 -2 h.01"/>
      <path d="M-5 3 C-2 7 2 7 5 3"/>
    </g>
    <text x="486" y="298" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="22" font-weight="800" fill="#072032">+15%</text>
    <text x="486" y="316" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" fill="#5C6972">Agent satisfaction</text>
  </g>
</svg>