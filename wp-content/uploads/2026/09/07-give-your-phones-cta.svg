<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="Set up a Botphonic AI voice agent this afternoon: connect a number, paste your FAQs, pick a voice, and your first call is answered in minutes">
  <defs>
    <linearGradient id="cta-panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C2C44"/>
      <stop offset="1" stop-color="#0A2438"/>
    </linearGradient>
    <linearGradient id="cta-coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9068"/><stop offset="1" stop-color="#FF7E55"/>
    </linearGradient>
    <linearGradient id="cta-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF7E55"/><stop offset="1" stop-color="#7FE0B4"/>
    </linearGradient>
    <filter id="cta-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="cta-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .cta-step{opacity:0;transform-box:fill-box;transform-origin:center;animation:ctaStep 7s ease-in-out infinite}
      @keyframes ctaStep{0%{opacity:0;transform:translateY(10px) scale(.96)}100%{opacity:1;transform:translateY(0) scale(1)}}
      .cta-check{stroke-dasharray:20;stroke-dashoffset:20;animation:ctaCheck 7s ease-in-out infinite}
      @keyframes ctaCheck{0%,4%{stroke-dashoffset:20}14%,100%{stroke-dashoffset:0}}
      .cta-conn{stroke-dasharray:6 8;animation:ctaConn 1.1s linear infinite}
      @keyframes ctaConn{to{stroke-dashoffset:-28}}
      .cta-pulse{transform-box:fill-box;transform-origin:center;animation:ctaPulse 2.2s ease-in-out infinite}
      @keyframes ctaPulse{0%,100%{opacity:.25;transform:scale(.9)}50%{opacity:.7;transform:scale(1.15)}}
      .cta-ripple{transform-box:fill-box;transform-origin:center;animation:ctaRipple 2.2s ease-out infinite}
      @keyframes ctaRipple{0%{opacity:.5;transform:scale(.7)}100%{opacity:0;transform:scale(1.9)}}
      .cta-bar{transform-box:fill-box;transform-origin:center bottom;animation:ctaBar 1s ease-in-out infinite}
      @keyframes ctaBar{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
      .cta-live{transform-box:fill-box;transform-origin:center;animation:ctaLive 2.2s ease-in-out infinite}
      @keyframes ctaLive{0%,100%{opacity:.5}50%{opacity:1}}
      .cta-timer{opacity:0;animation:ctaTimer 7s ease-in-out infinite}
      @keyframes ctaTimer{0%,72%{opacity:0}82%,100%{opacity:1}}
    </style>
  </defs>

  <!-- transparent background: sits on the section's navy #072032 -->

  <!-- soft ambient glow behind the live-call badge -->
  <circle cx="466" cy="252" r="150" fill="#FF7E55" opacity="0.06"/>
  <circle cx="466" cy="252" r="96" fill="#1E9E6A" opacity="0.05"/>

  <!-- Setup panel (left) -->
  <g filter="url(#cta-shadow)">
    <rect x="34" y="70" width="308" height="342" rx="22" fill="url(#cta-panel)" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.5"/>
  </g>

  <!-- window dots -->
  <circle cx="62" cy="98" r="5" fill="#FF7E55"/>
  <circle cx="80" cy="98" r="5" fill="#FFC24B"/>
  <circle cx="98" cy="98" r="5" fill="#7FE0B4"/>
  <text x="322" y="102" text-anchor="end" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#7FE0B4" letter-spacing="1">SETUP · 3 STEPS</text>

  <line x1="34" y1="120" x2="342" y2="120" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- STEP 1: Connect a number -->
  <g class="cta-step" style="animation-delay:0s">
    <rect x="58" y="140" width="260" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <circle cx="92" cy="173" r="19" fill="#0B5CFF"/>
    <path d="M84 168c0-2 1-3 3-3l4 1 2 5-3 3c1 3 3 5 6 6l3-3 5 2 1 4c0 2-1 3-3 3-9 0-18-9-18-18z" fill="#fff"/>
    <text x="122" y="168" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#fff">Connect a number</text>
    <text x="122" y="188" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#9FB3C4">port yours or get a new one</text>
    <circle cx="298" cy="160" r="11" fill="#12402E"/>
    <path class="cta-check" d="M292 160 l4 4 8 -9" fill="none" stroke="#7FE0B4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:.4s"/>
  </g>

  <!-- STEP 2: Paste your FAQs -->
  <g class="cta-step" style="animation-delay:1s">
    <rect x="58" y="216" width="260" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <circle cx="92" cy="249" r="19" fill="#7C5CFF"/>
    <path d="M84 240h14l4 4v14a2 2 0 01-2 2H84a2 2 0 01-2-2v-16a2 2 0 012-2z" fill="#fff"/>
    <path d="M87 249h9 M87 254h7" stroke="#7C5CFF" stroke-width="1.6" stroke-linecap="round"/>
    <text x="122" y="244" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#fff">Paste your FAQs</text>
    <text x="122" y="264" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#9FB3C4">the agent learns instantly</text>
    <circle cx="298" cy="236" r="11" fill="#12402E"/>
    <path class="cta-check" d="M292 236 l4 4 8 -9" fill="none" stroke="#7FE0B4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:1.4s"/>
  </g>

  <!-- STEP 3: Pick a voice -->
  <g class="cta-step" style="animation-delay:2s">
    <rect x="58" y="292" width="260" height="66" rx="14" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.10"/>
    <circle cx="92" cy="325" r="19" fill="url(#cta-coral)"/>
    <g transform="translate(92,325)">
      <rect class="cta-bar" x="-9" y="-7" width="3.5" height="14" rx="1.75" fill="#fff" style="animation-delay:0s"/>
      <rect class="cta-bar" x="-3.5" y="-9" width="3.5" height="18" rx="1.75" fill="#fff" style="animation-delay:.15s"/>
      <rect class="cta-bar" x="2" y="-7" width="3.5" height="14" rx="1.75" fill="#fff" style="animation-delay:.3s"/>
      <rect class="cta-bar" x="7.5" y="-5" width="3.5" height="10" rx="1.75" fill="#fff" style="animation-delay:.45s"/>
    </g>
    <text x="122" y="320" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#fff">Pick a voice</text>
    <text x="122" y="340" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#9FB3C4">65+ voices, 50+ languages</text>
    <circle cx="298" cy="312" r="11" fill="#12402E"/>
    <path class="cta-check" d="M292 312 l4 4 8 -9" fill="none" stroke="#7FE0B4" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="animation-delay:2.4s"/>
  </g>

  <!-- ready pill inside panel -->
  <g class="cta-step" style="animation-delay:2.6s">
    <rect x="58" y="370" width="260" height="26" rx="13" fill="#FF7E55" fill-opacity="0.16"/>
    <circle class="cta-live" cx="78" cy="383" r="4" fill="#FF7E55"/>
    <text x="92" y="387" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" font-weight="700" fill="#FF9068">Agent ready to take calls</text>
  </g>

  <!-- animated connector: panel -> live call -->
  <path class="cta-conn" d="M342 252 C 380 252, 388 252, 402 252" fill="none" stroke="#7FE0B4" stroke-width="3" stroke-linecap="round"/>

  <!-- LIVE CALL badge (right) -->
  <g>
    <circle class="cta-ripple" cx="466" cy="252" r="70" fill="none" stroke="#FF7E55" stroke-width="2"/>
    <circle class="cta-pulse" cx="466" cy="252" r="70" fill="none" stroke="url(#cta-ring)" stroke-width="2.5"/>
    <circle cx="466" cy="252" r="62" fill="url(#cta-panel)" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5" filter="url(#cta-shadow)"/>
    <circle cx="466" cy="230" r="26" fill="url(#cta-coral)" filter="url(#cta-glow)"/>
    <path d="M456 224c0-2.5 1.5-4 4-4l5.5 1.4 2.7 6.9-4 4c1.5 4 4 6.5 8 8l4-4 6.9 2.7 1.4 5.5c0 2.5-1.5 4-4 4-13 0-24-11-24-24z" fill="#fff"/>
    <text x="466" y="286" text-anchor="middle" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="800" fill="#fff" letter-spacing="1">FIRST CALL</text>
    <g class="cta-live">
      <circle cx="450" cy="300.5" r="3.2" fill="#7FE0B4"/>
      <text x="460" y="304" text-anchor="start" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="11" font-weight="700" fill="#7FE0B4" letter-spacing="1.5">LIVE</text>
    </g>
  </g>

  <!-- "answered in minutes" timer chip -->
  <g class="cta-timer">
    <g filter="url(#cta-shadow)">
      <rect x="388" y="346" width="156" height="42" rx="21" fill="#0C2C44" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
    </g>
    <circle cx="412" cy="367" r="11" fill="none" stroke="#7FE0B4" stroke-width="2"/>
    <path d="M412 361 v6 l4 3" fill="none" stroke="#7FE0B4" stroke-width="2" stroke-linecap="round"/>
    <text x="432" y="372" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#fff">Answered in minutes</text>
  </g>
</svg>