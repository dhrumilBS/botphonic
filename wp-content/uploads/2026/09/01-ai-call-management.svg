<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-label="AI call management: inbound and outbound calls handled with spam screening and live waveform">
  <defs>
    <linearGradient id="cm-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <linearGradient id="cm-coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9068"/>
      <stop offset="1" stop-color="#FF7E55"/>
    </linearGradient>
    <filter id="cm-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#072032" flood-opacity="0.10"/>
    </filter>
    <!-- Reusable, clear handset glyph centred on 0,0 (matches SVG 06 style) -->
    <path id="cm-phone" d="M-4.8 -8.2l2.9 0.5c0.6 0.1 1 0.5 1.2 1.1l0.9 3.4c0.2 0.6 0 1.3-0.5 1.7l-1.9 1.6c1 2.2 2.8 4 5 5l1.6-1.9c0.4-0.5 1.1-0.7 1.7-0.5l3.4 0.9c0.6 0.2 1 0.6 1.1 1.2l0.5 2.9c0.2 0.9-0.5 1.8-1.5 1.8-8.7 0-15.8-7.1-15.8-15.8 0-1 0.9-1.6 1.7-1.5z" fill="currentColor"/>
    <style>
      .cm-pulse{transform-box:fill-box;transform-origin:center;animation:cmPulse 2.4s ease-in-out infinite}
      @keyframes cmPulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:.9;transform:scale(1.12)}}
      .cm-bar{transform-box:fill-box;transform-origin:center bottom;animation:cmBar 1.1s ease-in-out infinite}
      @keyframes cmBar{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
      .cm-flow{stroke-dasharray:10 12;animation:cmDash 1.2s linear infinite}
      @keyframes cmDash{to{stroke-dashoffset:-44}}
      .cm-in{transform-box:fill-box;transform-origin:center;animation:cmChip 4s ease-in-out infinite}
      .cm-out{transform-box:fill-box;transform-origin:center;animation:cmChip 4s ease-in-out infinite 2s}
      @keyframes cmChip{0%,40%,100%{opacity:.55}12%,28%{opacity:1}}
      .cm-x{transform-box:fill-box;transform-origin:center;animation:cmX 2.8s ease-in-out infinite}
      @keyframes cmX{0%,100%{opacity:1;transform:scale(1)}45%{opacity:.55;transform:scale(.82)}}
      .cm-xring{transform-box:fill-box;transform-origin:center;animation:cmXring 2.8s ease-in-out infinite}
      @keyframes cmXring{0%,100%{opacity:0;transform:scale(1)}50%{opacity:.6;transform:scale(1.5)}}
    </style>
  </defs>

  <rect width="720" height="540" rx="28" fill="url(#cm-bg)"/>
  <rect x="1" y="1" width="718" height="538" rx="27" fill="none"/>

  <!-- INBOUND chip -->
  <g class="cm-in">
    <rect x="60" y="120" width="190" height="66" rx="16" fill="#fff" stroke="#D6DFE7" stroke-width="2" filter="url(#cm-shadow)"/>
    <circle cx="98" cy="153" r="19" fill="#1E9E6A"/>
    <use href="#cm-phone" x="98" y="153" color="#fff"/>
    <text x="130" y="149" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#072032">Inbound</text>
    <text x="130" y="170" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#5C6972">answered on ring 1</text>
  </g>

  <!-- OUTBOUND chip -->
  <g class="cm-out">
    <rect x="470" y="120" width="190" height="66" rx="16" fill="#fff" stroke="#D6DFE7" stroke-width="2" filter="url(#cm-shadow)"/>
    <circle cx="508" cy="153" r="19" fill="url(#cm-coral)"/>
    <use href="#cm-phone" x="508" y="153" color="#fff"/>
    <text x="540" y="149" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="17" font-weight="700" fill="#072032">Outbound</text>
    <text x="540" y="170" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#5C6972">dials your list</text>
  </g>

  <!-- flow lines to central agent (start at chip edge, end at core edge) -->
  <path class="cm-flow" d="M250 153 C 305 153, 300 240, 300 260" fill="none" stroke="#1E9E6A" stroke-width="3" stroke-linecap="round"/>
  <path class="cm-flow" d="M470 153 C 415 153, 420 240, 420 260" fill="none" stroke="#FF7E55" stroke-width="3" stroke-linecap="round"/>

  <!-- central AI agent core -->
  <circle cx="360" cy="272" r="86" fill="#072032"/>
  <circle class="cm-pulse" cx="360" cy="272" r="86" fill="none" stroke="#FF7E55" stroke-width="3"/>
  <text x="360" y="238" text-anchor="middle" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="600" fill="#7FE0B4" letter-spacing="2">AI AGENT</text>

  <!-- live waveform (centred group; bars centred on baseline y=285) -->
  <g transform="translate(360,285)">
    <rect class="cm-bar" x="-56" y="-24" width="8" height="48" rx="4" fill="#FF7E55" style="animation-delay:0s"/>
    <rect class="cm-bar" x="-40" y="-24" width="8" height="48" rx="4" fill="#FF9068" style="animation-delay:.15s"/>
    <rect class="cm-bar" x="-24" y="-24" width="8" height="48" rx="4" fill="#7FE0B4" style="animation-delay:.3s"/>
    <rect class="cm-bar" x="-8"  y="-24" width="8" height="48" rx="4" fill="#FF7E55" style="animation-delay:.45s"/>
    <rect class="cm-bar" x="8"   y="-24" width="8" height="48" rx="4" fill="#7FE0B4" style="animation-delay:.6s"/>
    <rect class="cm-bar" x="24"  y="-24" width="8" height="48" rx="4" fill="#FF9068" style="animation-delay:.35s"/>
    <rect class="cm-bar" x="40"  y="-24" width="8" height="48" rx="4" fill="#FF7E55" style="animation-delay:.2s"/>
  </g>

  <!-- spam screening tag -->
  <g transform="translate(255,412)">
    <rect width="230" height="60" rx="16" fill="#fff" stroke="#D6DFE7" stroke-width="2" filter="url(#cm-shadow)"/>
    <!-- static wrapper positions the icon; inner groups only scale/pulse -->
    <g transform="translate(34,30)">
      <circle class="cm-xring" r="18" fill="none" stroke="#E0483F" stroke-width="2"/>
      <g class="cm-x">
        <circle r="16" fill="#E0483F"/>
        <path d="M-6 -6 L6 6 M6 -6 L-6 6" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>
      </g>
    </g>
    <text x="62" y="27" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#072032">Spam screened</text>
    <text x="62" y="45" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="12" fill="#5C6972">robocalls blocked before ring</text>
  </g>
</svg>