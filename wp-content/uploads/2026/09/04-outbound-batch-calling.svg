<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" width="720" height="540" role="img" aria-label="Outbound batch calling: many parallel calls with live pickup and outcome tracking">
  <defs>
    <linearGradient id="bc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFD"/>
      <stop offset="1" stop-color="#EEF3F8"/>
    </linearGradient>
    <linearGradient id="bc-coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9068"/><stop offset="1" stop-color="#FF7E55"/>
    </linearGradient>
    <filter id="bc-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#072032" flood-opacity="0.10"/>
    </filter>
    <!-- clear handset glyph centred on 0,0 (matches SVG 01 & 06 style) -->
    <path id="bc-phone" d="M-4.8 -8.2l2.9 0.5c0.6 0.1 1 0.5 1.2 1.1l0.9 3.4c0.2 0.6 0 1.3-0.5 1.7l-1.9 1.6c1 2.2 2.8 4 5 5l1.6-1.9c0.4-0.5 1.1-0.7 1.7-0.5l3.4 0.9c0.6 0.2 1 0.6 1.1 1.2l0.5 2.9c0.2 0.9-0.5 1.8-1.5 1.8-8.7 0-15.8-7.1-15.8-15.8 0-1 0.9-1.6 1.7-1.5z" fill="currentColor"/>
    <style>
      .bc-pulse{transform-box:fill-box;transform-origin:center;animation:bcPulse 2s ease-in-out infinite}
      @keyframes bcPulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:.85;transform:scale(1.25)}}
      .bc-flow{stroke-dasharray:8 10;animation:bcDash 1s linear infinite}
      @keyframes bcDash{to{stroke-dashoffset:-36}}
      .bc-row{opacity:0;animation:bcRow .5s ease forwards}
      @keyframes bcRow{to{opacity:1}}
      .bc-dot{transform-box:fill-box;transform-origin:center;animation:bcDot 1.4s ease-in-out infinite}
      @keyframes bcDot{0%,100%{opacity:.4}50%{opacity:1}}
      .bc-fill{animation:bcFill 4s ease-in-out infinite}
      @keyframes bcFill{0%{width:0}60%,100%{width:230px}}
      .bc-count{opacity:0;animation:bcCount 4s ease-in-out infinite}
      @keyframes bcCount{0%,20%{opacity:0}35%,100%{opacity:1}}
    </style>
  </defs>

  <rect width="720" height="540" rx="28" fill="url(#bc-bg)"/>
  <rect x="1" y="1" width="718" height="538" rx="27" fill="none" stroke="#D6DFE7" stroke-width="2"/>

  <text x="56" y="76" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="20" font-weight="800" fill="#072032">Batch campaign</text>
  <text x="56" y="98" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#5C6972">thousands of calls placed in parallel</text>

  <!-- central dialer -->
  <g transform="translate(140,300)">
    <circle class="bc-pulse" r="70" fill="none" stroke="#FF7E55" stroke-width="3"/>
    <circle r="56" fill="url(#bc-coral)" filter="url(#bc-shadow)"/>
    <use href="#bc-phone" color="#fff" transform="scale(1.85)"/>
    <text y="90" text-anchor="middle" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#072032">Dialer</text>
  </g>

  <!-- parallel call lines to contact rows -->
  <g>
    <path class="bc-flow" d="M204 268 C 280 250, 320 178, 380 178" fill="none" stroke="#1E9E6A" stroke-width="3" stroke-linecap="round"/>
    <path class="bc-flow" d="M210 300 C 300 300, 330 236, 380 236" fill="none" stroke="#FF7E55" stroke-width="3" stroke-linecap="round"/>
    <path class="bc-flow" d="M210 300 C 300 300, 330 294, 380 294" fill="none" stroke="#0B5CFF" stroke-width="3" stroke-linecap="round"/>
    <path class="bc-flow" d="M204 332 C 280 350, 320 352, 380 352" fill="none" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- contact outcome rows -->
  <g font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif">
    <g class="bc-row" style="animation-delay:.1s">
      <rect x="380" y="156" width="284" height="44" rx="12" fill="#fff" stroke="#D6DFE7" stroke-width="2" filter="url(#bc-shadow)"/>
      <text x="400" y="183" font-size="14" font-weight="600" fill="#072032">+1 (415) 555‑0148</text>
      <rect x="560" y="167" width="84" height="22" rx="11" fill="#EAF6F0"/>
      <circle class="bc-dot" cx="574" cy="178" r="4" fill="#1E9E6A"/>
      <text x="586" y="182" font-size="12" font-weight="700" fill="#1E9E6A">Picked up</text>
    </g>
    <g class="bc-row" style="animation-delay:.35s">
      <rect x="380" y="214" width="284" height="44" rx="12" fill="#fff" stroke="#D6DFE7" stroke-width="2" filter="url(#bc-shadow)"/>
      <text x="400" y="241" font-size="14" font-weight="600" fill="#072032">+1 (628) 555‑0199</text>
      <rect x="556" y="225" width="88" height="22" rx="11" fill="#FFF2EC"/>
      <circle class="bc-dot" cx="570" cy="236" r="4" fill="#FF7E55"/>
      <text x="582" y="240" font-size="12" font-weight="700" fill="#E86A44">Ringing…</text>
    </g>
    <g class="bc-row" style="animation-delay:.6s">
      <rect x="380" y="272" width="284" height="44" rx="12" fill="#fff" stroke="#D6DFE7" stroke-width="2" filter="url(#bc-shadow)"/>
      <text x="400" y="299" font-size="14" font-weight="600" fill="#072032">+1 (917) 555‑0132</text>
      <rect x="556" y="283" width="88" height="22" rx="11" fill="#EAF6F0"/>
      <circle class="bc-dot" cx="570" cy="294" r="4" fill="#1E9E6A"/>
      <text x="582" y="298" font-size="12" font-weight="700" fill="#1E9E6A">Booked</text>
    </g>
    <g class="bc-row" style="animation-delay:.85s">
      <rect x="380" y="330" width="284" height="44" rx="12" fill="#fff" stroke="#D6DFE7" stroke-width="2" filter="url(#bc-shadow)"/>
      <text x="400" y="357" font-size="14" font-weight="600" fill="#072032">+1 (305) 555‑0175</text>
      <rect x="556" y="341" width="88" height="22" rx="11" fill="#F1F5F9"/>
      <text x="600" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="#64748B">Voicemail</text>
    </g>
  </g>

  <!-- progress -->
  <g transform="translate(56,446)">
    <text font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#072032">Campaign progress</text>
    <rect x="0" y="16" width="230" height="14" rx="7" fill="#E4EBF1"/>
    <rect class="bc-fill" x="0" y="16" height="14" rx="7" fill="#1E9E6A"/>
    <g class="bc-count">
      <text x="250" y="28" font-family="Manrope,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#072032">1,284 / 2,000 dialed</text>
    </g>
  </g>
</svg>